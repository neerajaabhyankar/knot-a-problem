<!doctype html>
<meta charset="utf-8">
<title>Corner tweaker — tetrahedral 4-Borromean</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ground:#eef1f3; --surface:#f9fafb; --sunk:#e3e7ea; --rule:#cfd6da;
  --ink:#101a21; --soft:#4d5a63; --faint:#7a868e;
  --accent:#15617a; --accent-soft:#d6e7ee; --warn:#a3400f;
  --sA:#b23f0d; --sB:#1a6885; --sC:#8f7013; --sD:#3b6b35;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0c1216; --surface:#131b20; --sunk:#090f12; --rule:#243039;
  --ink:#dfe6ea; --soft:#91a0a9; --faint:#67747d;
  --accent:#6cb6d2; --accent-soft:#17323e; --warn:#e08a52;
  --sA:#eb7340; --sB:#55b1d0; --sC:#dcb843; --sD:#7ab868; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:15px}
.wrap{max-width:1040px; margin:0 auto; padding:18px 16px 40px}
h1{font-size:17px; font-weight:600; margin:0 0 2px}
.sub{color:var(--soft); font-size:13.5px; margin:0 0 14px}
.stage{background:var(--surface); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
canvas{display:block; width:100%; height:min(66vh,620px); cursor:grab; touch-action:none}
canvas.orbit{cursor:grabbing} canvas.over{cursor:crosshair} canvas.drag{cursor:none}
.rail{display:flex; flex-wrap:wrap; align-items:center; gap:9px 16px; padding:10px 12px; border-top:1px solid var(--rule); background:var(--sunk)}
.grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.lab{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}
button{font-family:var(--mono); font-size:12.5px; color:var(--soft); background:transparent; border:1px solid var(--rule); border-radius:2px; padding:4px 9px; cursor:pointer}
button:hover{border-color:var(--faint); color:var(--ink)}
button[aria-pressed=true]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.strand .dot{width:9px; height:9px; border-radius:50%; background:currentColor; display:inline-block; margin-right:5px; vertical-align:-1px}
#rA{color:var(--sA)} #rB{color:var(--sB)} #rC{color:var(--sC)} #rD{color:var(--sD)}
.strand[aria-pressed=false]{opacity:.4}
.read{display:flex; flex-wrap:wrap; gap:4px 18px; padding:9px 12px; border-top:1px solid var(--rule);
      font-family:var(--mono); font-size:12px; color:var(--faint)}
.read b{color:var(--ink); font-weight:600} .read .w{color:var(--warn)}
.note{color:var(--soft); font-size:13.5px; line-height:1.55; margin:16px 0 0; max-width:74ch}
.note code{font-family:var(--mono); font-size:12.5px; background:var(--sunk); padding:1px 4px; border-radius:2px}
kbd{font-family:var(--mono); font-size:11.5px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:0 4px}
</style>

<div class="wrap">
<h1>Corner tweaker — tetrahedral 4-Borromean</h1>
<p class="sub">Drag any corner. Its eleven symmetric twins move with it, and the drag is capped so no strand can pass through another.</p>

<div class="stage">
  <canvas id="view"></canvas>
  <div class="rail">
    <div class="grp"><span class="lab">corners</span><span id="counts"></span></div>
    <div class="grp"><span class="lab">rings</span>
      <button class="strand" id="rA" aria-pressed="true"><span class="dot"></span>A</button>
      <button class="strand" id="rB" aria-pressed="true"><span class="dot"></span>B</button>
      <button class="strand" id="rC" aria-pressed="true"><span class="dot"></span>C</button>
      <button class="strand" id="rD" aria-pressed="true"><span class="dot"></span>D</button>
    </div>
    <div class="grp"><span class="lab">view</span>
      <button id="ax3">3-fold</button><button id="ax2">2-fold</button><button id="axc">clearest</button>
      <button id="spin" aria-pressed="false">spin</button>
    </div>
    <div class="grp"><span class="lab">edit</span>
      <button id="undo">undo</button><button id="reset">reset</button>
      <button id="expArc">save arc</button><button id="expScene">save .knot.json</button>
    </div>
  </div>
  <div class="read" id="read"></div>
</div>

<p class="note" id="help"></p>
</div>

<script src="starts.js"></script>
<script>
// ---------------------------------------------------------------- the group
// Ring A is one third of itself under the 3-fold rotation R3; the three
// half-turns make B, C and D. Same two operations as the parent directory, so
// what is on screen is the verified geometry rather than a copy of it — and
// editing a corner of the stored arc moves all twelve of its images at once,
// which is what keeps the link exactly tetrahedral at every moment of a drag.
const R3    = (p) => [p[2], p[0], p[1]];
const R3inv = (p) => [p[1], p[2], p[0]];
const G = [ (p)=>p, (p)=>[p[0],-p[1],-p[2]], (p)=>[-p[0],p[1],-p[2]], (p)=>[-p[0],-p[1],p[2]] ];
const NAMES = ['A','B','C','D'];

const ringA = (arc) => { const b = arc.map(R3); return [...arc, ...b, ...b.map(R3)]; };
const buildRings = (arc) => G.map((g) => ringA(arc).map(g));

// ------------------------------------------------- distances between EDGES
// Vertex sampling is the wrong measure with long straight edges: two edges can
// pass close with every corner far from every other corner. Everything that
// decides whether a drag is allowed is edge-to-edge.
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const len = (a) => Math.hypot(a[0], a[1], a[2]);

function segDist(p0,p1,q0,q1){
  const u = sub(p1,p0), v = sub(q1,q0), w = sub(p0,q0);
  const a = dot(u,u), b = dot(u,v), c = dot(v,v), d = dot(u,w), e = dot(v,w);
  const D = a*c - b*b;
  let s = D < 1e-12 ? 0 : (b*e - c*d)/D;
  s = Math.max(0, Math.min(1, s));
  let t = Math.max(0, Math.min(1, (b*s + e)/(c > 1e-12 ? c : 1)));
  s = Math.max(0, Math.min(1, (b*t - d)/(a > 1e-12 ? a : 1)));
  return Math.hypot(w[0] + s*u[0] - t*v[0], w[1] + s*u[1] - t*v[1], w[2] + s*u[2] - t*v[2]);
}
const edgesOf = (ring) => ring.map((p,i) => [p, ring[(i+1) % ring.length]]);

/** Closest approach anywhere in the link: ring to ring, and each ring to itself. */
function gapOf(rings){
  const E = rings.map(edgesOf);
  let best = Infinity;
  for (let a = 0; a < E.length; a++){
    for (let b = a+1; b < E.length; b++)
      for (const [p0,p1] of E[a]) for (const [q0,q1] of E[b])
        best = Math.min(best, segDist(p0,p1,q0,q1));
    const n = E[a].length;
    for (let i = 0; i < n; i++) for (let j = i+2; j < n; j++){
      if (i === 0 && j === n-1) continue;
      best = Math.min(best, segDist(E[a][i][0], E[a][i][1], E[a][j][0], E[a][j][1]));
    }
  }
  return best;
}

/** Edge lengths and turn angles — the two ways a drag can make a shape degenerate. */
function shapeOf(rings){
  const r = rings[0], n = r.length;
  const L = r.map((p,i) => len(sub(r[(i+1)%n], p)));
  const turn = r.map((b,i) => {
    const u = sub(b, r[(i-1+n)%n]), v = sub(r[(i+1)%n], b);
    return Math.acos(Math.max(-1, Math.min(1, dot(u,v)/(len(u)*len(v))))) * 180/Math.PI;
  });
  const rms = Math.sqrt(r.reduce((s,p) => s + dot(p,p), 0) / n);
  return { minEdge: Math.min(...L), turnMax: Math.max(...turn), rms };
}

// ------------------------------------------------------------ what a drag may do
// THE GUARANTEE, and it is the whole reason the tool is safe to play with.
// Let `gap` be the current closest approach between two strands. Every point of
// the link is an isometric image of the arc, so moving one arc corner by d
// moves no point of the link further than |d|. Two strands can therefore
// approach each other by at most 2|d| in a step, and 2|d| < gap means they
// cannot meet: the link type is preserved BY CONSTRUCTION, not by re-checking.
// The pointer is free to run ahead; the corner follows at this speed limit.
const STEP = 0.45;    // of the current gap, so 2*STEP < 1
const FLOOR = 0.02;   // never let the link get tighter than this, cap or no cap
const TURN_MAX = 150; // degrees; past this a corner is a spike, degenerate to project
const EDGE_MIN = 0.1; // of the ring's own size; stops corners collapsing together

let CORNERS = 12, arc = null, rings = null, gap = 0, shape = null;
const edited = {};    // corner count -> arc, so switching counts does not lose work
const history = [];
let blocked = 0;      // frames since the last refused move, for the readout

function setArc(next){
  arc = next.map((p) => [...p]);
  rings = buildRings(arc);
  gap = gapOf(rings);
  shape = shapeOf(rings);
  edited[CORNERS] = arc.map((p) => [...p]);
  crossings = null;
  try { localStorage.setItem('tweak', JSON.stringify(edited)); } catch {}
}

function setCount(m){
  CORNERS = m;
  setArc(edited[m] ?? STARTS[m].arc);
  history.length = 0;
  for (const b of document.querySelectorAll('#counts button'))
    b.setAttribute('aria-pressed', String(+b.dataset.m === m));
  draw(); readout();
}

/**
 * Move corner `ci` of ring `ri` by `world`, as far as the speed limit allows.
 * The corner is an image of arc corner `ci % k` under R3^floor(ci/k) then g[ri];
 * both are rotations, so the arc moves by the inverse of those applied to the
 * world delta, and the other eleven images follow from the rebuild.
 */
function dragCorner(ri, ci, world){
  const k = arc.length, rot = Math.floor(ci / k);
  let d = G[ri](world);                      // the half-turns are involutions
  for (let i = 0; i < rot; i++) d = R3inv(d);

  const cap = STEP * gap;
  const m = len(d);
  if (m > cap) d = d.map((x) => x * cap/m);  // the speed limit, not a rejection

  const trial = arc.map((p) => [...p]);
  trial[ci % k] = [trial[ci % k][0]+d[0], trial[ci % k][1]+d[1], trial[ci % k][2]+d[2]];
  const next = buildRings(trial);
  const g2 = gapOf(next), s2 = shapeOf(next);
  if (g2 < FLOOR || s2.turnMax > TURN_MAX || s2.minEdge < EDGE_MIN * s2.rms){
    blocked = 18; return false;              // refused: a strand, a spike or a collapse
  }
  arc = trial; rings = next; gap = g2; shape = s2;
  edited[CORNERS] = arc.map((p) => [...p]);
  crossings = null;
  if (m > cap) blocked = 2;                  // capped, not refused — a softer warning
  return true;
}

// ------------------------------------------------------------------ the view
const cv = document.getElementById('view'), ctx = cv.getContext('2d');
const shown = [true,true,true,true];
let M = [1,0,0, 0,1,0, 0,0,1], spinning = false, W = 0, H = 0, scale = 1, cx = 0, cy = 0;
let mode = null, last = null, grabbed = null, hover = null, crossings = null;

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mul = (A,B) => { const C = new Array(9);
  for (let i=0;i<3;i++) for (let j=0;j<3;j++){ let s=0; for (let k=0;k<3;k++) s+=A[i*3+k]*B[k*3+j]; C[i*3+j]=s; } return C; };
const ap  = (m,p) => [m[0]*p[0]+m[1]*p[1]+m[2]*p[2], m[3]*p[0]+m[4]*p[1]+m[5]*p[2], m[6]*p[0]+m[7]*p[1]+m[8]*p[2]];
const apT = (m,p) => [m[0]*p[0]+m[3]*p[1]+m[6]*p[2], m[1]*p[0]+m[4]*p[1]+m[7]*p[2], m[2]*p[0]+m[5]*p[1]+m[8]*p[2]];
const rotX = (a) => [1,0,0, 0,Math.cos(a),-Math.sin(a), 0,Math.sin(a),Math.cos(a)];
const rotY = (a) => [Math.cos(a),0,Math.sin(a), 0,1,0, -Math.sin(a),0,Math.cos(a)];

function frameFor(d){
  const n = len(d), w = d.map((x) => x/n);
  const s = Math.abs(w[0]) < 0.9 ? [1,0,0] : [0,1,0];
  let u = [s[1]*w[2]-s[2]*w[1], s[2]*w[0]-s[0]*w[2], s[0]*w[1]-s[1]*w[0]];
  const un = len(u); u = u.map((x) => x/un);
  const v = [w[1]*u[2]-w[2]*u[1], w[2]*u[0]-w[0]*u[2], w[0]*u[1]-w[1]*u[0]];
  return [u[0],u[1],u[2], v[0],v[1],v[2], w[0],w[1],w[2]];
}

function size(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale = Math.min(W,H) * 0.34; cx = W/2; cy = H/2;
}
const screenOf = (p) => { const q = ap(M,p); return [cx + q[0]*scale, cy - q[1]*scale, q[2]]; };

/** Straight edges stay straight; the extra points exist only for the depth sort. */
const PER = 6;
function densify(ring){
  const out = [];
  for (let i = 0; i < ring.length; i++){
    const a = ring[i], b = ring[(i+1) % ring.length];
    for (let k = 0; k < PER; k++) out.push([a[0]+(b[0]-a[0])*k/PER, a[1]+(b[1]-a[1])*k/PER, a[2]+(b[2]-a[2])*k/PER]);
  }
  return out;
}

const CHUNK = 3;
function draw(){
  const ground = css('--surface'), cols = [css('--sA'), css('--sB'), css('--sC'), css('--sD')];
  ctx.fillStyle = ground; ctx.fillRect(0,0,W,H);
  const items = [];
  const twins = grabbed ? grabbed.ci % arc.length : (hover ? hover.ci % arc.length : -1);

  rings.forEach((ring, ri) => {
    if (!shown[ri]) return;
    const P = densify(ring).map(screenOf), n = P.length;
    for (let s = 0; s < n; s += CHUNK){
      const run = []; let depth = 0;
      for (let k = 0; k <= CHUNK; k++){ const q = P[(s+k)%n]; run.push(q); depth += q[2]; }
      items.push({ kind:'seg', ri, depth: depth/(CHUNK+1), run });
    }
    ring.forEach((p, ci) => {
      const q = screenOf(p);
      items.push({ kind:'dot', ri, ci, depth: q[2], at: q, twin: ci % arc.length === twins });
    });
  });
  items.sort((a,b) => a.depth - b.depth);

  // Two strokes per run: a wide one in the page colour, which is what cuts the
  // strand behind it, then the colour. Butt caps, or the ground pass eats the
  // next chunk of the same ring and every ring turns into a dashed line.
  const w0 = Math.max(4, Math.min(W,H) * 0.015);
  for (const it of items){
    const t = 1 + 0.16 * it.depth;
    if (it.kind === 'seg'){
      ctx.lineJoin = 'miter'; ctx.miterLimit = 6; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(it.run[0][0], it.run[0][1]);
      for (let i = 1; i < it.run.length; i++) ctx.lineTo(it.run[i][0], it.run[i][1]);
      ctx.strokeStyle = ground; ctx.lineWidth = w0*t + 7; ctx.stroke();
      ctx.strokeStyle = cols[it.ri]; ctx.lineWidth = w0*t; ctx.stroke();
    } else {
      const held = grabbed && grabbed.ri === it.ri && grabbed.ci === it.ci;
      const near = hover && hover.ri === it.ri && hover.ci === it.ci;
      const r = w0*t*(held || near ? 0.95 : 0.6);
      ctx.beginPath(); ctx.arc(it.at[0], it.at[1], r, 0, Math.PI*2);
      ctx.fillStyle = it.twin ? cols[it.ri] : ground; ctx.fill();
      ctx.lineWidth = Math.max(1.6, w0*t*0.3); ctx.strokeStyle = cols[it.ri]; ctx.stroke();
      if (held){ ctx.beginPath(); ctx.arc(it.at[0], it.at[1], r + 6, 0, Math.PI*2);
                 ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2; ctx.stroke(); }
    }
  }
  if (blocked > 0){
    blocked--;
    ctx.fillStyle = css('--warn'); ctx.font = `600 12px ${css('--mono') || 'monospace'}`;
    ctx.fillText('held back — a strand is as close as it may come', 14, H - 14);
  }
}

/** The corner nearest the pointer, front-most first, within grabbing distance. */
function pick(x, y){
  let best = null;
  rings.forEach((ring, ri) => {
    if (!shown[ri]) return;
    ring.forEach((p, ci) => {
      const q = screenOf(p), d = Math.hypot(q[0]-x, q[1]-y);
      if (d < 16 && (!best || q[2] > best.z || (Math.abs(q[2]-best.z) < 0.05 && d < best.d)))
        best = { ri, ci, z: q[2], d };
    });
  });
  return best;
}

// --------------------------------------------------------- crossings in view
// The number the whole exercise is about: how busy the picture is from here.
function countCrossings(m = M){
  const P = rings.map((ring) => ring.map((p) => {
    const q = ap(m,p); return [q[0], q[1]];
  }));
  const segs = [];
  P.forEach((ring, ri) => ring.forEach((p,i) => segs.push({ ri, i, a: p, b: ring[(i+1)%ring.length] })));
  // Both parameters strictly inside (0,1): an edge ending ON another edge is a
  // degenerate picture, not a crossing, and counting it would reward exactly
  // the views that are hardest to read.
  const cross = (p1,p2,p3,p4) => {
    const r = [p2[0]-p1[0], p2[1]-p1[1]], s = [p4[0]-p3[0], p4[1]-p3[1]];
    const d = r[0]*s[1] - r[1]*s[0];
    if (Math.abs(d) < 1e-12) return false;          // parallel, or a zero-length edge
    const qp = [p3[0]-p1[0], p3[1]-p1[1]];
    const t = (qp[0]*s[1] - qp[1]*s[0]) / d;
    const u = (qp[0]*r[1] - qp[1]*r[0]) / d;
    return t > 0 && t < 1 && u > 0 && u < 1;
  };
  let n = 0;
  for (let i = 0; i < segs.length; i++) for (let j = i+1; j < segs.length; j++){
    const A = segs[i], B = segs[j];
    if (A.ri === B.ri){
      const L = P[A.ri].length;
      if (A.i === B.i || (A.i+1)%L === B.i || (B.i+1)%L === A.i) continue;
    }
    if (cross(A.a, A.b, B.a, B.b)) n++;
  }
  return n;
}

/** Fibonacci sphere, as knotlib does it — the fewest crossings wins. */
function clearestView(){
  let best = null;
  const n = 240, phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++){
    const y = 1 - (2*i)/(n-1), r = Math.sqrt(Math.max(0, 1 - y*y)), a = phi*i;
    const m = frameFor([Math.cos(a)*r, y, Math.sin(a)*r]);
    const c = countCrossings(m);
    if (!best || c < best.c) best = { c, m };
  }
  M = best.m; crossings = best.c;
}

function readout(){
  if (crossings === null) crossings = countCrossings();
  const start = STARTS[CORNERS];
  const touched = JSON.stringify(arc) !== JSON.stringify(start.arc);
  document.getElementById('read').innerHTML =
    `<span>corners <b>${CORNERS}</b> per ring, <b>${arc.length}</b> distinct` +
      `${touched ? ' <b class="w">&middot; edited</b>' : ''}</span>` +
    `<span>closest approach <b class="${gap < 0.05 ? 'w' : ''}">${gap.toFixed(4)}</b> ` +
      `<span style="opacity:.7">(started ${start.gap})</span></span>` +
    `<span>crossings in this view <b>${crossings}</b></span>` +
    `<span>shortest edge <b>${shape.minEdge.toFixed(2)}</b></span>` +
    `<span>sharpest turn <b>${shape.turnMax.toFixed(0)}&deg;</b></span>`;
}

// ------------------------------------------------------------------- input
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  grabbed = pick(x, y);
  if (grabbed) history.push(arc.map((p) => [...p]));
  mode = grabbed ? 'drag' : 'orbit';
  last = [x, y];
  cv.setPointerCapture(e.pointerId);
  cv.className = mode;
  draw();
});

cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (!mode){
    const was = hover; hover = pick(x, y);
    cv.className = hover ? 'over' : '';
    if ((was && was.ci) !== (hover && hover.ci) || (was === null) !== (hover === null)) draw();
    return;
  }
  const dx = x - last[0], dy = y - last[1];
  last = [x, y];
  if (mode === 'orbit'){
    M = mul(mul(rotX(dy*0.008), rotY(dx*0.008)), M);
    crossings = null;
  } else {
    // Screen motion, read back into the world through the view rotation: across
    // the screen by default, along the line of sight with Shift held.
    const world = e.shiftKey ? apT(M, [0, 0, -dy/scale]) : apT(M, [dx/scale, -dy/scale, 0]);
    dragCorner(grabbed.ri, grabbed.ci, world);
  }
  draw(); readout();
});

const release = () => {
  if (mode === 'drag' && history.length && JSON.stringify(history[history.length-1]) === JSON.stringify(arc))
    history.pop();                       // a click that moved nothing is not an edit
  mode = null; grabbed = null; cv.className = '';
  try { localStorage.setItem('tweak', JSON.stringify(edited)); } catch {}
  draw(); readout();
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

addEventListener('keydown', (e) => {
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});

function undo(){
  const prev = history.pop();
  if (!prev) return;
  setArc(prev);
  draw(); readout();
}

// ------------------------------------------------------------------ the rail
const counts = document.getElementById('counts');
for (const m of Object.keys(STARTS).map(Number).sort((a,b) => a-b)){
  const b = document.createElement('button');
  b.textContent = m; b.dataset.m = m;
  b.addEventListener('click', () => setCount(m));
  counts.append(b);
}
NAMES.forEach((n,i) => {
  const b = document.getElementById('r'+n);
  b.addEventListener('click', () => {
    shown[i] = !shown[i]; b.setAttribute('aria-pressed', String(shown[i]));
    crossings = null; draw(); readout();
  });
});
document.getElementById('ax3').onclick = () => { M = frameFor([1,1,1]); crossings = null; draw(); readout(); };
document.getElementById('ax2').onclick = () => { M = frameFor([0,0,1]); crossings = null; draw(); readout(); };
document.getElementById('axc').onclick = () => { clearestView(); draw(); readout(); };
document.getElementById('undo').onclick = undo;
document.getElementById('reset').onclick = () => {
  history.push(arc.map((p) => [...p]));
  setArc(STARTS[CORNERS].arc); draw(); readout();
};
const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', String(spinning)); };

function save(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const r5 = (x) => Math.round(x * 1e5) / 1e5;
document.getElementById('expArc').onclick = () => save(`arc-${CORNERS}.json`, JSON.stringify({
  format: 'four-borromean/tweak', corners: CORNERS, gap: r5(gap),
  crossings, from: STARTS[CORNERS].gap, arc: arc.map((p) => p.map(r5)),
}, null, 1));
document.getElementById('expScene').onclick = () => {
  const k = 0.32 / gap;                 // the editor's own working scale, as final.mjs uses
  const PALETTE = ['#c1440e','#2a7ea8','#c9a227','#4a8b3a'];
  save(`tweaked-${CORNERS}.knot.json`, JSON.stringify({
    format: 'knot-a-problem/scene', version: 1, saved: new Date().toISOString(),
    by: 'four-borromean/tweak', curves: rings.map((ring, i) => ({
      name: `Tetrahedral 4-Borromean (${CORNERS} corners) — face ${NAMES[i]}`,
      color: PALETTE[i], radius: 0.075, closed: true, by: 'agent',
      points: ring.map((p) => p.map((x) => r5(x*k))),
    })),
  }, null, 1));
};

document.getElementById('help').innerHTML =
  `<b>Drag a corner</b> and its eleven twins — two more on the same ring, three on each of the others — ` +
  `move with it, so the link stays exactly tetrahedral. Hold <kbd>shift</kbd> to push the corner away from you ` +
  `instead of across the screen. Drag the background to turn the link; <kbd>${navigator.platform.includes('Mac') ? '&#8984;' : 'ctrl+'}z</kbd> undoes. ` +
  `<br><br>The corner follows your pointer at a speed limit of <b>0.45 &times; the current closest approach</b>, ` +
  `so two strands can never close the gap between them in one step: <b>the link type cannot change, whatever you do</b>. ` +
  `When the shape would spike or collapse instead, the move is refused outright and the canvas says so. ` +
  `<br><br><b>Only multiples of three are offered</b>, and that is the symmetry rather than a shortcut: each ring ` +
  `repeats three times under its own 120&deg; turn, so a ring with 3k corners has only k distinct ones — ` +
  `the 24-corner link is eight corners of work, the 6-corner link is two. ` +
  `<b>Crossings in this view</b> counts the strands that cross in the picture as drawn. A view down a symmetry ` +
  `axis is usually the busiest rather than the clearest — the 12-corner link reads 57 down the 3-fold axis and 33 ` +
  `from the direction <b>clearest</b> finds, searching 240 of them. Symmetric views also drop crossings exactly on ` +
  `top of each other, which knotlib refuses as degenerate, so turn a little off-axis before exporting one. ` +
  `<br><br>Every starting shape is knotlib-verified — all four sublinks Borromean. ` +
  `To re-verify one you have tweaked: <code>save arc</code>, then <code>node check.mjs arc-${'<n>'}.json</code>. ` +
  `<code>save .knot.json</code> writes a scene the main editor opens.`;

// ------------------------------------------------------------------- start
try { Object.assign(edited, JSON.parse(localStorage.getItem('tweak') || '{}')); } catch {}
addEventListener('resize', () => { size(); draw(); });
size();
M = frameFor([1,1,1]);
setCount(12);
(function loop(){
  if (spinning && !mode){ M = mul(rotY(0.0035), M); crossings = null; draw(); }
  else if (blocked > 0) draw();
  requestAnimationFrame(loop);
})();
</script>
